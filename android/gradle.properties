org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 creates unit-test components only for the tested build type by default,
# which removes testReleaseUnitTest. The gates intentionally run and count both
# debug and release test results, so both components are pinned explicitly.
android.onlyEnableUnitTestForTheTestedBuildType=false
