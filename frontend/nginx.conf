worker_processes 2;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Stable URLs and reproducible mtimes cannot identify changed bytes.
        # Ignore validators from older builds as well as preventing new caches.
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
