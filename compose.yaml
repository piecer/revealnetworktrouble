services:
  api:
    build:
      context: .
      args:
        VERSION: ${CHECKNETWORK_VERSION:-dev}
        REVISION: ${CHECKNETWORK_REVISION:-dev}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    environment:
      CHECKNETWORK_ALLOWED_ORIGINS: http://localhost:3000
      CHECKNETWORK_ADDR: :8080
      CHECKNETWORK_MODE: ${CHECKNETWORK_MODE:-trusted-local}
      CHECKNETWORK_API_KEY: ${CHECKNETWORK_API_KEY:-}
      CHECKNETWORK_RATE_LIMIT_PER_MINUTE: ${CHECKNETWORK_RATE_LIMIT_PER_MINUTE:-}
    ports:
      - "127.0.0.1:9090:8080"
    stop_grace_period: 6m
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
