services:
  api:
    build: .
    environment:
      CHECKNETWORK_ALLOWED_ORIGINS: http://localhost:3000
      CHECKNETWORK_ADDR: :8080
      CHECKNETWORK_MODE: trusted-local
    ports:
      - "127.0.0.1:9090:8080"
    stop_grace_period: 6m
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
