services:
  api:
    build: .
    environment:
      CHECKNETWORK_ALLOWED_ORIGINS: http://localhost:3000
      CHECKNETWORK_ADDR: :8080
      CHECKNETWORK_MODE: trusted-local
    ports:
      - "127.0.0.1:9090:8080"
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
